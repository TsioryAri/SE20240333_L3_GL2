{% extends 'base.html' %}{% block title %}Connexion — PharmaGest{% endblock %}
{% block content %}<div class="login-card"><div class="brand text-center mb-2">✚ PharmaGest</div><p class="text-muted text-center mb-4">Connectez-vous à votre espace</p>
<form method="post">{% csrf_token %}{{ form.non_field_errors }}
<div class="mb-3"><label class="form-label">Nom d'utilisateur</label>{{ form.username }}</div>
<div class="mb-3"><label class="form-label">Mot de passe</label>{{ form.password }}</div>
<button class="btn btn-primary w-100">Se connecter</button></form></div>{% endblock %}
