{% extends 'base.html' %}{% block content %}<h1 class="mb-2">Nouvelle vente</h1><p class="text-muted mb-4">Choisissez les médicaments et les quantités. Le stock sera décrémenté à la validation.</p><div class="panel"><form method="post">{% csrf_token %}<div class="mb-3"><label class="form-label">Client (facultatif)</label><select name="client" class="form-select"><option value="">Vente comptoir</option>{% for c in clients %}<option value="{{ c.pk }}">{{ c.nom }} — {{ c.telephone }}</option>{% endfor %}</select></div><div id="lines"><div class="row g-2 sale-line mb-2"><div class="col-md-9"><select name="medicament" class="form-select" required><option value="">Choisir un médicament</option>{% for m in medicaments %}<option value="{{ m.pk }}">{{ m.nom }} — {{ m.prix_vente }} Ar (stock : {{ m.stock_total }})</option>{% endfor %}</select></div><div class="col-md-3"><input class="form-control" type="number" min="1" name="quantite" value="1" required></div></div></div><button type="button" class="btn btn-outline-secondary btn-sm mb-3" onclick="addLine()">＋ Ajouter une ligne</button><div class="mb-3"><label class="form-label">Mode de paiement</label><select name="mode_paiement" class="form-select"><option value="ESPECES">Espèces</option><option value="MVOLA">Mobile Money</option><option value="AUTRE">Autre</option></select></div><button class="btn btn-primary">Valider la vente</button><a href="{% url 'sale_list' %}" class="btn btn-light">Annuler</a></form></div><script>function addLine(){const c=document.querySelector('.sale-line').cloneNode(true);c.querySelector('select').selectedIndex=0;c.querySelector('input').value=1;document.getElementById('lines').appendChild(c)}</script>{% endblock %}
